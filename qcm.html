<!DOCTYPE html>
<html>
<head>
<title>QCM LED3</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>✅ QCM LED3</h1>

<div class="card">

<p>24V × 5A = ?</p>

<button onclick="correct()">120W</button>
<button onclick="wrong()">24W</button>
<button onclick="wrong()">5W</button>

<p>AC signifie ?</p>

<button onclick="correct()">Courant alternatif</button>
<button onclick="wrong()">Courant continu</button>

<p>3000K correspond à ?</p>

<button onclick="correct()">Blanc chaud</button>
<button onclick="wrong()">Blanc froid</button>

<h2 id="score">Score : 0</h2>

</div>

<script>

let points=0;

function correct(){
points++;
document.getElementById("score").innerText=
"Score : "+points;
}

function wrong(){
alert("Mauvaise réponse");
}

</script>

</body>
</html>
