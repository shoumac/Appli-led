<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM LED3</title>

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
text-align:center;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
max-width:700px;
margin:auto;
}

.rep{
display:block;
width:100%;
margin:10px 0;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.nav{
padding:12px 20px;
margin-top:15px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

#result{
margin-top:15px;
font-size:18px;
}
</style>
</head>

<body>

<div class="card">

<h1>✅ QCM LED3</h1>

<h2 id="question"></h2>

<div id="answers"></div>

<div id="result"></div>

<button class="nav" onclick="nextQuestion()">➡️ Suivant</button>

<p id="score"></p>

</div>

<script>

const banque = [

{
q:"En série, que reste-t-il identique ?",
a:["La tension","Le courant","La puissance"],
c:1,
e:"Dans un montage série, le même courant traverse tous les composants."
},

{
q:"En parallèle, que reste-t-il identique ?",
a:["La tension","Le courant","La résistance"],
c:0,
e:"Dans un montage parallèle, chaque branche reçoit la même tension."
},

{
q:"Formule de la puissance ?",
a:["P = U × I","P = E × t","P = R × I"],
c:0,
e:"La puissance est égale à la tension multipliée par le courant."
},

{
q:"Formule de l'énergie ?",
a:["E = P × t","E = U × I","E = R × I"],
c:0,
e:"L'énergie dépend de la puissance et du temps."
},

{
q:"Que signifie CC ?",
a:["Constant Cable","Constant Current","Current Control"],
c:1,
e:"CC signifie Constant Current : courant constant."
},

{
q:"Que signifie CV ?",
a:["Constant Voltage","Current Voltage","Cable Voltage"],
c:0,
e:"CV signifie Constant Voltage : tension constante."
},

{
q:"3000K correspond à ?",
a:["Blanc froid","Blanc neutre","Blanc chaud"],
c:2,
e:"3000K correspond à une lumière chaude."
},

{
q:"4000K correspond à ?",
a:["Blanc neutre","Blanc chaud","Blanc froid"],
c:0,
e:"4000K correspond à un blanc neutre."
},

{
q:"6500K correspond à ?",
a:["Blanc chaud","Blanc froid","Blanc neutre"],
c:1,
e:"6500K correspond à un blanc froid."
},

{
q:"Que signifie IRC ?",
a:["Indice de rendu des couleurs","Indice de résistance courant","Intensité résistive"],
c:0,
e:"L'IRC mesure la qualité du rendu des couleurs."
}

];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function melanger(){
questions = [...banque]
.sort(() => Math.random() - 0.5);
}

function afficherQuestion(){

answered = false;

document.getElementById("result").innerHTML = "";

document.getElementById("question").innerHTML =
questions[current].q;

let html = "";

questions[current].a.forEach((rep,index)=>{

html += `
<button class="rep" onclick="verifier(${index})">
${rep}
</button>
`;

});

document.getElementById("answers").innerHTML = html;

document.getElementById("score").innerHTML =
"Question " + (current+1) + " / " + questions.length;
}

function verifier(index){

if(answered) return;

answered = true;

let bonne =
questions[current].a[questions[current].c];

if(index === questions[current].c){

score++;

document.getElementById("result").innerHTML = `
✅ Bonne réponse
<br><br>
💡 ${questions[current].e}
`;

}else{

document.getElementById("result").innerHTML = `
❌ Mauvaise réponse
<br><br>
✅ Bonne réponse : <b>${bonne}</b>
<br><br>
💡 ${questions[current].e}
`;

}

}

function nextQuestion(){

if(!answered) return;

current++;

if(current >= questions.length){

let pourcentage =
Math.round((score/questions.length)*100);

let niveau = "📚 Débutant";

if(score >= questions.length*0.5) niveau = "👍 Correct";
if(score >= questions.length*0.8) niveau = "🥈 Confirmé";
if(score === questions.length) niveau = "🥇 Expert LED3";

document.querySelector(".card").innerHTML = `
<h2>🎯 Résultat</h2>
<h1>${score}/${questions.length}</h1>
<h2>${pourcentage}%</h2>
<h3>${niveau}</h3>

<button class="nav" onclick="location.reload()">
🔄 Nouveau QCM
</button>
`;

return;
}

afficherQuestion();

}

melanger();
afficherQuestion();

</script>

</body>
</html>
