<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM LED3</title>

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
text-align:center;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
max-width:700px;
margin:auto;
}

button{
padding:12px 20px;
margin:8px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.rep{
display:block;
width:100%;
}

#result{
font-size:20px;
font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

<h1>✅ QCM LED3</h1>

<h2 id="question"></h2>

<div id="answers"></div>

<p id="result"></p>

<button onclick="nextQuestion()">➡️ Suivant</button>

<p id="score"></p>

</div>

<script>

const banque = [

{q:"En série, que reste-t-il identique ?",a:["La tension","Le courant","La puissance"],c:1},
{q:"En parallèle, que reste-t-il identique ?",a:["La tension","Le courant","La résistance"],c:0},
{q:"Formule de la puissance ?",a:["P = U × I","P = E × t","P = R × I"],c:0},
{q:"Formule de l'énergie ?",a:["E = P × t","E = U × I","E = R × I"],c:0},
{q:"Que signifie CC ?",a:["Constant Cable","Constant Current","Current Control"],c:1},
{q:"Que signifie CV ?",a:["Constant Voltage","Current Voltage","Cable Voltage"],c:0},
{q:"Température 3000K ?",a:["Blanc froid","Blanc neutre","Blanc chaud"],c:2},
{q:"Température 4000K ?",a:["Blanc neutre","Blanc chaud","Blanc froid"],c:0},
{q:"Température 6500K ?",a:["Blanc chaud","Blanc froid","Blanc neutre"],c:1},
{q:"Unité du flux lumineux ?",a:["Lux","Lumen","Watt"],c:1},
{q:"Unité de l'éclairement ?",a:["Lux","Lumen","Volt"],c:0},
{q:"Que signifie IRC ?",a:["Indice de rendu des couleurs","Indice de résistance","Indice courant"],c:0},
{q:"Que signifie IP ?",a:["Indice de protection","Indice puissance","Indice pilotage"],c:0},
{q:"Que signifie IK ?",a:["Résistance aux chocs","Indice Kelvin","Intensité connue"],c:0},
{q:"Que signifie PF ?",a:["Facteur de puissance","Puissance finale","Protection fusible"],c:0},
{q:"Que signifie THD ?",a:["Distorsion harmonique totale","Thermal Driver","Tension harmonique"],c:0},
{q:"Montage série ?",a:["Courant identique","Tension identique","Puissance identique"],c:0},
{q:"Montage parallèle ?",a:["Courant identique","Tension identique","Résistance identique"],c:1},
{q:"Les tensions en série ?",a:["S'additionnent","Restent identiques","Diminuent"],c:0},
{q:"Les courants en parallèle ?",a:["S'additionnent","Restent identiques","Diminuent"],c:0},
{q:"Que régule un driver CC ?",a:["Le courant","La tension","La température"],c:0},
{q:"Que régule un driver CV ?",a:["La tension","Le courant","La puissance"],c:0},
{q:"Le blanc chaud correspond à ?",a:["3000K","4000K","6500K"],c:0},
{q:"Le blanc neutre correspond à ?",a:["4000K","3000K","6500K"],c:0},
{q:"Le blanc froid correspond à ?",a:["6500K","4000K","3000K"],c:0},
{q:"Une LED ouverte provoque ?",a:["Extinction de la chaîne","Plus de lumière","Aucun effet"],c:0},
{q:"Le courant se mesure en ?",a:["Ampère","Volt","Watt"],c:0},
{q:"La tension se mesure en ?",a:["Volt","Ampère","Lux"],c:0},
{q:"La puissance se mesure en ?",a:["Watt","Volt","Lux"],c:0},
{q:"La sécurité SELV concerne ?",a:["La basse tension","La puissance","La couleur"],c:0}

];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function melanger(){
questions = [...banque]
.sort(() => Math.random() - 0.5)
.slice(0,10);
}

function afficherQuestion(){

answered = false;

document.getElementById("result").innerHTML = "";

document.getElementById("question").innerHTML =
questions[current].q;

let html = "";

questions[current].a.forEach((rep,index)=>{

html += `
<button class="rep" onclick="verifier(${index})">
${rep}
</button>
`;

});

document.getElementById("answers").innerHTML = html;

document.getElementById("score").innerHTML =
"Question " + (current+1) + " / 10";
}

function verifier(index){

if(answered) return;

answered = true;

if(index === questions[current].c){

score++;
document.getElementById("result").innerHTML =
"✅ Bonne réponse";

}else{

document.getElementById("result").innerHTML =
"❌ Mauvaise réponse";

}

}

function nextQuestion(){

if(!answered) return;

current++;

if(current >= questions.length){

let pourcentage =
Math.round((score/questions.length)*100);

document.querySelector(".card").innerHTML = `

<h2>🎯 Résultat</h2>

<h1>${score}/${questions.length}</h1>

<h2>${pourcentage}%</h2>

<button onclick="location.reload()">
🔄 Nouveau QCM
</button>

`;

return;
}

afficherQuestion();

}

melanger();
afficherQuestion();

</script>

</body>
</html>
