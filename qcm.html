let questions = [];
let current = 0;
let score = 0;
let answered = false;

function melanger(){

questions = [...banque];

for(let i = questions.length - 1; i > 0; i--){

let j = Math.floor(Math.random() * (i + 1));

[questions[i], questions[j]] =
[questions[j], questions[i]];

}

}

function afficherQuestion(){

answered = false;

document.getElementById("result").innerHTML = "";

document.getElementById("question").innerHTML =
questions[current].q;

let html = "";

questions[current].a.forEach((rep,index)=>{

html += `
<button class="rep" onclick="verifier(${index})">
${rep}
</button>
`;

});

document.getElementById("answers").innerHTML = html;

document.getElementById("score").innerHTML =
"Question " + (current+1) + " / " + questions.length;
}

function verifier(index){

if(answered) return;

answered = true;

let bonne =
questions[current].a[questions[current].c];

if(index === questions[current].c){

score++;

document.getElementById("result").innerHTML = `
✅ Bonne réponse
<br><br>
💡 ${questions[current].e}
`;

}else{

document.getElementById("result").innerHTML = `
❌ Mauvaise réponse
<br><br>
✅ Bonne réponse : <b>${bonne}</b>
<br><br>
💡 ${questions[current].e}
`;

}

}

function nextQuestion(){

if(!answered) return;

current++;

if(current >= questions.length){

let pourcentage =
Math.round((score/questions.length)*100);

let niveau = "📚 Débutant";

if(score >= questions.length*0.5) niveau = "👍 Correct";
if(score >= questions.length*0.8) niveau = "🥈 Confirmé";
if(score === questions.length) niveau = "🥇 Expert LED3";

document.querySelector(".card").innerHTML = `
<h2>🎯 Résultat</h2>
<h1>${score}/${questions.length}</h1>
<h2>${pourcentage}%</h2>
<h3>${niveau}</h3>

<button class="nav" onclick="location.reload()">
🔄 Nouveau QCM
</button>
`;

return;
}

afficherQuestion();

}
