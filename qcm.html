<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="theme-color" content="#0f172a">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM LED3</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="logo">
✅ QCM LED3
</div>

<div class="card">

<h1>✅ QCM LED3</h1>

<div class="card">

<h2 id="question"></h2>

<div id="answers"></div>

<p id="result"></p>

<button onclick="nextQuestion()">➡️ Suivant</button>

<p id="score"></p>

</div>

<script>

const banque = [

{q:"En série, que reste-t-il identique ?",a:["La tension","Le courant","La puissance"],c:1},

{q:"En parallèle, que reste-t-il identique ?",a:["La tension","Le courant","La résistance"],c:0},

{q:"Formule de la puissance ?",a:["P = U × I","P = E × t","P = R × I"],c:0},

{q:"Formule de l'énergie ?",a:["E = P × t","E = U × I","E = R × I"],c:0},

{q:"Que signifie CC ?",a:["Constant Cable","Constant Current","Current Control"],c:1},

{q:"Que signifie CV ?",a:["Constant Voltage","Current Voltage","Cable Voltage"],c:0},

{q:"Température 3000K ?",a:["Blanc froid","Blanc neutre","Blanc chaud"],c:2},

{q:"Température 4000K ?",a:["Blanc neutre","Blanc chaud","Blanc froid"],c:0},

{q:"Température 6500K ?",a:["Blanc chaud","Blanc froid","Blanc neutre"],c:1},

{q:"Unité du flux lumineux ?",a:["Lux","Lumen","Watt"],c:1},

{q:"Unité de l'éclairement ?",a:["Lux","Lumen","Volt"],c:0},

{q:"Que signifie IRC ?",a:["Indice de rendu des couleurs","Indice de résistance courant","Intensité résistive calculée"],c:0},

{q:"Que signifie UGR ?",a:["Unified Glare Rating","Ultra Green Ratio","Universal Grid Resistance"],c:0},

{q:"Que régule un driver CC ?",a:["La tension","Le courant","La puissance"],c:1},

{q:"Que régule un driver CV ?",a:["La tension","Le courant","La température"],c:0},

{q:"Montage série ?",a:["Courant identique","Tension identique","Puissance identique"],c:0},

{q:"Montage parallèle ?",a:["Courant identique","Tension identique","Résistance identique"],c:1},

{q:"Les tensions en série ?",a:["S'additionnent","Restent identiques","Disparaissent"],c:0},

{q:"Les courants en parallèle ?",a:["Restent identiques","S'additionnent","Diminuent"],c:1},

{q:"Cause fréquente d'un ruban LED qui clignote ?",a:["Driver ou chute de tension","IRC faible","Température couleur"],c:0},

{q:"Que signifie IP ?",a:["Indice de protection","Indice de puissance","Indice de pilotage"],c:0},

{q:"Que signifie IK ?",a:["Résistance aux chocs","Indice Kelvin","Intensité connue"],c:0},

{q:"Que signifie PF ?",a:["Facteur de puissance","Puissance finale","Protection fusible"],c:0},

{q:"Que signifie THD ?",a:["Distorsion harmonique totale","Thermal Heat Driver","Tension Haute Distribution"],c:0},

{q:"Principal risque d'un montage série-parallèle ?",a:["Mauvais partage du courant","Tension trop faible","IRC faible"],c:0}

];

let questions = [];
let current = 0;
let score = 0;
let answered = false;

function melanger(){
questions = [...banque]
.sort(()=>Math.random()-0.5)
.slice(0,5);
}

function afficherQuestion(){

answered = false;

document.getElementById("result").innerHTML="";

document.getElementById("question").innerHTML=
questions[current].q;

let html="";

questions[current].a.forEach((rep,index)=>{

html += `
<button onclick="verifier(${index})">
${rep}
</button><br><br>
`;

});

document.getElementById("answers").innerHTML=html;

document.getElementById("score").innerHTML=
"Question "+(current+1)+" / 5";
}

function verifier(index){

if(answered) return;

answered = true;

if(index===questions[current].c){

score++;

document.getElementById("result").innerHTML=
"✅ Bonne réponse";

}else{

document.getElementById("result").innerHTML=
"❌ Mauvaise réponse";
}
}

function nextQuestion(){

if(!answered) return;

current++;

if(current>=5){

let pourcentage=Math.round((score/5)*100);

let niveau="📚 Révision";

if(score>=3) niveau="👍 Correct";
if(score>=4) niveau="🥈 Très bien";
if(score===5) niveau="🥇 Expert";

document.querySelector(".card").innerHTML=`

<h2>🎯 Résultat</h2>

<h1>${score}/5</h1>

<h2>${pourcentage}%</h2>

<p>${niveau}</p>

<button onclick="location.reload()">
🔄 Nouveau QCM
</button>

`;

return;
}

afficherQuestion();
}

melanger();
afficherQuestion();

</script>

</script>

</body>
</html>
