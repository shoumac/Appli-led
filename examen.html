<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">

<title>Examen Blanc LED3</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
padding:20px;
text-align:center;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
max-width:700px;
margin:auto;
}

.rep{
display:block;
width:100%;
margin:10px 0;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.nav{
padding:12px 20px;
margin-top:15px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.btn-retour{
display:inline-block;
padding:10px 15px;
background:#38bdf8;
color:white;
text-decoration:none;
border-radius:10px;
margin-bottom:20px;
font-weight:bold;
}

.selected{
outline:3px solid #38bdf8;
}

</style>

</head>

<body>

<a href="index.html" class="btn-retour">
⬅ Retour
</a>

<div class="card">

<h1>🎓 Examen Blanc LED3</h1>

<p>25 questions aléatoires</p>

<h2 id="question"></h2>

<div id="answers"></div>

<button class="nav" onclick="valider()">
✅ Valider
</button>

<p id="progression"></p>

</div>

<script>

const banque = [

{
q:"Loi d'Ohm ?",
a:["U = R × I","U = P × I","U = R ÷ I"],
c:1
},

{
q:"Unité du courant ?",
a:["Volt","Ampère","Watt"],
c:1
},

{
q:"Unité de puissance ?",
a:["Watt","Lux","Lumen"],
c:3
},

{
q:"Formule de la puissance ?",
a:["P = U × I","P = U ÷ I","P = R × U"],
c:2
},

{
q:"Unité de résistance ?",
a:["Ohm","Volt","Lux"],
c:0
},

{
q:"Que signifie CC ?",
a:["Constant Current","Constant Color","Current Control"],
c:2
},

{
q:"Que signifie CV ?",
a:["Constant Voltage","Current Voltage","Control Voltage"],
c:1
},

{
q:"Rôle du driver ?",
a:["Alimenter la LED","Refroidir la LED","Mesurer la température"],
c:3
},

{
q:"3000K correspond à ?",
a:["Blanc chaud","Blanc froid","Bleu"],
c:2
},

{
q:"6500K correspond à ?",
a:["Blanc froid","Blanc chaud","Orange"],
c:3
},

{
q:"En série le courant est ?",
a:["Identique","Différent","Nul"],
c:2
},

{
q:"En parallèle la tension est ?",
a:["Identique","Différente","Nulle"],
c:1
},

{
q:"Une LED coupée en série ?",
a:["Coupe toute la chaîne","Ne change rien","Double la tension"],
c:0
},

{
q:"La résistance augmente avec ?",
a:["La longueur","La section","Le refroidissement"],
c:2
},

{
q:"La résistance diminue avec ?",
a:["La section","La longueur","La température"],
c:1
},

{
q:"Tj signifie ?",
a:["Température de jonction","Température du câble","Température driver"],
c:3
},

{
q:"Rôle du dissipateur ?",
a:["Évacuer la chaleur","Créer la lumière","Alimenter la LED"],
c:1
},

{
q:"Une poche d'air provoque ?",
a:["Mauvais transfert thermique","Meilleur transfert","Aucun effet"],
c:3
},

{
q:"La conduction est ?",
a:["Un transfert dans un solide","Un transfert lumineux","Un transfert électrique"],
c:2
},

{
q:"Le rayonnement est ?",
a:["Un mode de transfert thermique","Une tension","Une résistance"],
c:1
},

{
q:"Mesure recommandée ?",
a:["Sous charge","À vide","Au hasard"],
c:0
},

{
q:"Point chaud = ?",
a:["Échauffement local","Refroidissement","Panne réseau"],
c:2
},

{
q:"Cause fréquente d'un clignotement ?",
a:["Driver défectueux","IRC élevé","Couleur chaude"],
c:3
},

{
q:"Première étape du diagnostic ?",
a:["Observer","Remplacer","Démonter"],
c:1
},

{
q:"Ennemi principal des LED ?",
a:["La chaleur","Le cuivre","La lumière"],
c:3
}

];

let examen = [...banque]
.sort(() => Math.random() - 0.5)
.slice(0,25);

let current = 0;
let score = 0;
let choix = null;

function afficherQuestion(){

document.getElementById("question").innerHTML =
examen[current].q;

let html = "";

examen[current].a.forEach((rep,index)=>{

html += `
<button class="rep"
onclick="selectionner(${index},this)">
${rep}
</button>
`;

});

document.getElementById("answers").innerHTML = html;

document.getElementById("progression").innerHTML =
"Question " + (current+1) + " / 25";

}

function selectionner(index,element){

choix = index;

document.querySelectorAll(".rep").forEach(btn=>{
btn.classList.remove("selected");
});

element.classList.add("selected");

}

function valider(){

if(choix === null){

alert("Choisis une réponse");

return;

}

if(choix === examen[current].c){

score++;

}

choix = null;

current++;

if(current >= 25){

finExamen();

return;

}

afficherQuestion();

}

function finExamen(){

let pourcentage =
Math.round((score/25)*100);

let niveau = "📚 À retravailler";

if(pourcentage >= 50)
niveau = "👍 Correct";

if(pourcentage >= 70)
niveau = "🥈 Bon niveau";

if(pourcentage >= 85)
niveau = "🥇 Prêt LED3";

document.querySelector(".card").innerHTML = `

<h1>🎯 Résultat Final</h1>

<h2>${score}/25</h2>

<h2>${pourcentage}%</h2>

<h3>${niveau}</h3>

<button class="nav"
onclick="location.reload()">
🔄 Refaire l'examen
</button>

`;

}

afficherQuestion();

</script>

</body>
</html>
