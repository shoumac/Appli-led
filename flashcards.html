<!DOCTYPE html>
<html>
<head>
<title>Flashcards LED3</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🧠 Flashcards LED3</h1>

<div class="card">

<h2 id="question"></h2>

<button onclick="showAnswer()">Voir la réponse</button>

<p id="answer"></p>

<br>

<button onclick="previousCard()">⬅️ Précédent</button>

<button onclick="nextCard()">➡️ Suivant</button>

<p id="counter"></p>

</div>

<script>

const cards = [

["Formule de la puissance ?","P = U × I"],
["Formule de l'énergie ?","E = P × t"],
["AC signifie ?","Courant alternatif"],
["DC signifie ?","Courant continu"],
["Unité de la tension ?","Volt"],
["Unité du courant ?","Ampère"],
["Unité de la puissance ?","Watt"],
["Température 3000K ?","Blanc chaud"],
["Température 4000K ?","Blanc neutre"],
["Température 6500K ?","Blanc froid"],
["Que régule un driver CC ?","Le courant"],
["Que signifie IRC ?","Indice de rendu des couleurs"],
["Que signifie UGR ?","Unified Glare Rating"],
["Les résistances thermiques en série ?","Elles s'additionnent"],
["Conduction ?","Transfert thermique dans les solides"],
["Convection ?","Transfert thermique avec l'air"],
["Rayonnement ?","Transfert par rayonnement"],
["Pourquoi un dissipateur ?","Évacuer la chaleur"],
["Formule intensité ?","I = P ÷ U"],
["Formule tension ?","U = P ÷ I"]

];

let current=0;

function updateCard(){
document.getElementById("question").innerText=cards[current][0];
document.getElementById("answer").innerText="";
document.getElementById("counter").innerText=
"Carte "+(current+1)+" / "+cards.length;
}

function showAnswer(){
document.getElementById("answer").innerText=
cards[current][1];
}

function nextCard(){
current++;
if(current>=cards.length) current=0;
updateCard();
}

function previousCard(){
current--;
if(current<0) current=cards.length-1;
updateCard();
}

updateCard();

</script>

</body>
</html>
