<!DOCTYPE html>
<html lang="fr">

<head>
<meta name="theme-color" content="#0f172a">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards LED3</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<a href="index.html" class="btn-retour">⬅ Retour</a>
<div class="logo">
🧠 Flashcards LED3
</div>

<div class="card">

<h2 id="question"></h2>

<button onclick="showAnswer()">
👁 Voir la réponse
</button>

<p id="answer" style="font-size:20px;margin-top:20px;"></p>

<br>

<button onclick="previousCard()">
⬅️ Précédent
</button>

<button onclick="nextCard()">
➡️ Suivant
</button>

<button onclick="randomCard()">
🎲 Aléatoire
</button>

<p id="counter"></p>

</div>

<script>

const cards = [

["Loi d'Ohm ?","U = R × I"],
["Unité de tension ?","Volt"],
["Unité de courant ?","Ampère"],
["Unité de résistance ?","Ohm"],
["Unité de puissance ?","Watt"],

["Formule puissance ?","P = U × I"],
["Formule énergie ?","E = P × t"],
["Formule intensité ?","I = P ÷ U"],
["Formule tension ?","U = P ÷ I"],

["AC signifie ?","Courant alternatif"],
["DC signifie ?","Courant continu"],

["Que signifie CV ?","Constant Voltage"],
["Que signifie CC ?","Constant Current"],

["Driver CC régule ?","Le courant"],
["Driver CV régule ?","La tension"],

["Température 3000K ?","Blanc chaud"],
["Température 4000K ?","Blanc neutre"],
["Température 6500K ?","Blanc froid"],

["Unité flux lumineux ?","Lumen"],
["Unité éclairement ?","Lux"],

["IRC signifie ?","Indice de rendu des couleurs"],
["UGR signifie ?","Unified Glare Rating"],

["DALI signifie ?","Protocole de pilotage"],
["PWM signifie ?","Modulation largeur impulsion"],

["IP signifie ?","Indice de protection"],
["IK signifie ?","Résistance aux chocs"],

["PF signifie ?","Facteur de puissance"],
["THD signifie ?","Distorsion harmonique totale"],
["SELV signifie ?","Très basse tension de sécurité"],

["PCB signifie ?","Circuit imprimé"],

["Montage série ?","Courant identique"],
["Montage parallèle ?","Tension identique"],

["En série les tensions ?","S'additionnent"],
["En parallèle les courants ?","S'additionnent"],

["Chute de tension ?","Perte de tension dans les câbles"],

["Résistance augmente avec ?","La longueur"],
["Résistance diminue avec ?","La section"],

["Conduction ?","Transfert thermique dans un solide"],
["Convection ?","Transfert thermique par déplacement d'air"],
["Rayonnement ?","Transfert thermique par rayonnement"],

["Tj signifie ?","Température de jonction"],
["Ta signifie ?","Température ambiante"],

["Rôle du dissipateur ?","Évacuer la chaleur"],
["Rôle de la pâte thermique ?","Améliorer le contact thermique"],
["Poche d'air ?","Mauvais transfert thermique"],

["LED ouverte ?","Coupe la chaîne série"],

["Mesure à vide suffisante ?","Non"],
["Mesure sous charge ?","Oui"],

["Point chaud ?","Échauffement localisé"],

["Cause d'un ruban LED qui clignote ?","Chute de tension ou driver défectueux"]
,

// Flashcards essentielles des sessions 17 à 24
["Que décrit le premier chiffre IP ?", "La protection contre les corps solides et l'accès aux parties dangereuses."],

["Que décrit le deuxième chiffre IP ?", "La protection contre la pénétration de l'eau."],

["IP65 signifie-t-il immersion permanente ?", "Non. Le 5 correspond aux jets d'eau selon des conditions normalisées."],

["IP élevé = anticorrosion garantie ?", "Non, les matériaux et traitements doivent être vérifiés séparément."],

["Avant nettoyage ou maintenance ?", "Suivre les consignes fabricant et mettre l'installation en sécurité."],

["Unité du flux lumineux ?", "Lumen (lm)."],

["Le flux mesure-t-il l'éclairement en un point ?", "Non, l'éclairement se mesure en lux."],

["Le flux du luminaire égale-t-il toujours celui des LED ?", "Non, des pertes optiques et thermiques peuvent exister."],

["Quel instrument mesure le flux total ?", "Un équipement photométrique adapté, par exemple une sphère intégrante."],

["Un flux élevé garantit-il une bonne uniformité ?", "Non, la distribution et la disposition des luminaires comptent."],

["Unité de l'éclairement ?", "Lux (lx)."],

["Unité de l'intensité lumineuse ?", "Candela (cd)."],

["1 lux correspond à quoi ?", "1 lumen reçu par mètre carré."],

["Quel appareil mesure les lux ?", "Un luxmètre."],

["Pourquoi mesurer plusieurs points ?", "Pour évaluer les variations et l'uniformité de l'éclairement."],

["Unité d'efficacité lumineuse ?", "lm/W."],

["Formule de l'efficacité lumineuse ?", "Flux lumineux divisé par puissance électrique."],

["À flux égal, quel système est plus efficace ?", "Celui qui consomme moins de puissance."],

["Pourquoi vérifier la puissance système ?", "Pour tenir compte du driver et comparer des données équivalentes."],

["lm/W est-il le seul critère de choix ?", "Non : confort, qualité lumineuse, durée de vie et application comptent aussi."],

["Rôle d'une optique ?", "Diriger ou répartir la lumière."],

["Un faisceau étroit sert à quoi ?", "Concentrer la lumière sur une zone ciblée."],

["Un diffuseur peut-il entraîner des pertes ?", "Oui, il peut absorber ou disperser une partie du flux."],

["Que montre un diagramme polaire ?", "La distribution de l'intensité lumineuse selon les directions."],

["Quels critères guident le choix d'optique ?", "Usage, hauteur, géométrie, uniformité et confort visuel."],

["Que décrit la CCT ?", "L'apparence chaude ou froide de la lumière blanche."],

["3000 K correspond généralement à quoi ?", "Un blanc chaud."],

["4000 K correspond généralement à quoi ?", "Un blanc neutre."],

["À quoi sert le SDCM ?", "À exprimer les écarts de chromaticité entre sources."],

["Même CCT = teinte identique garantie ?", "Non, la chromaticité peut différer."],

["Que signifie IRC ?", "Indice de rendu des couleurs."],

["Que suggère un IRC élevé ?", "Un rendu plus fidèle pour les couleurs évaluées par la méthode."],

["Que renseigne le R9 ?", "Le rendu d'un rouge saturé."],

["IRC élevé garantit-il un R9 élevé ?", "Non, vérifier le R9 séparément."],

["Que vérifier pour un éclairage de qualité ?", "IRC/Ra, R9 si pertinent, CCT et données photométriques."],

["Que cherche à évaluer l'UGR ?", "L'éblouissement d'inconfort."],

["Un UGR plus faible indique généralement quoi ?", "Moins d'éblouissement d'inconfort dans la configuration étudiée."],

["Que décrit l'uniformité ?", "La régularité de l'éclairement sur une zone."],

["Pourquoi considérer la sécurité photobiologique ?", "Pour évaluer les risques liés à l'exposition au rayonnement optique."],

["Peut-on appliquer une valeur UGR à toute pièce ?", "Non, elle dépend notamment de la configuration et des conditions d'évaluation."]
];

let current = 0;

function updateCard(){

document.getElementById("question").innerText =
cards[current][0];

document.getElementById("answer").innerText = "";

document.getElementById("counter").innerText =
"Carte " + (current + 1) + " / " + cards.length;

}

function showAnswer(){

document.getElementById("answer").innerText =
cards[current][1];

}

function nextCard(){

current++;

if(current >= cards.length){
current = 0;
}

updateCard();

}

function previousCard(){

current--;

if(current < 0){
current = cards.length - 1;
}

updateCard();

}

function randomCard(){

current = Math.floor(Math.random() * cards.length);

updateCard();

}

updateCard();

</script>

</body>
</html>
