<h1>📐 Formules LED</h1>

<div class="card">
<h2>Puissance</h2>
P = U × I
</div>

<div class="card">
<h2>Intensité</h2>
I = P ÷ U
</div>

<div class="card">
<h2>Tension</h2>
U = P ÷ I
</div>

<div class="card">
<h2>Énergie</h2>
E = P × t
</div>

<div class="card">
<h2>Thermique</h2>
ΔT = P × Rθ
</div>
