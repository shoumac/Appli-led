<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — LED3 Academy</title><link rel="stylesheet" href="style.css"><style>body{background:#080d18;color:#f4f7ff;font-family:system-ui}.box{max-width:480px;margin:8vh auto;padding:24px;background:#111b2d;border:1px solid #26344e;border-radius:16px}label,input,button{display:block;width:100%;box-sizing:border-box;margin:10px 0}input{padding:12px;border-radius:8px;background:#080d18;color:white;border:1px solid #40506c}button{padding:12px;border:0;border-radius:8px;background:#168bff;color:white;font-weight:bold;cursor:pointer}.muted{color:#a5b4cc}#msg{white-space:pre-wrap}</style></head><body><main class="box"><a href="index.html">← Accueil</a><h1>🔐 Connexion LED3 Academy</h1><p class="muted">Connecte-toi avec ton propre compte. Ton formateur doit utiliser son compte personnel.</p><form id="login"><label>Adresse e-mail<input id="email" type="email" required autocomplete="username"></label><label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label><button>Se connecter</button></form><button id="reset" type="button">Recevoir un lien de réinitialisation</button><p id="msg" role="status"></p><p class="muted">Le compte doit déjà avoir été créé dans Supabase Authentication. Cette page ne crée pas de nouveaux comptes.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const c=supabase.createClient(LED3_SUPABASE_URL,LED3_SUPABASE_PUBLISHABLE_KEY);const msg=document.getElementById('msg');document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Connexion…';const {error}=await c.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent='Connexion impossible : '+error.message;return}msg.textContent='Connexion réussie. Synchronisation…';const next=new URLSearchParams(location.search).get('next')||'index.html';location.href=next});document.getElementById('reset').onclick=async()=>{if(!email.value.trim()){msg.textContent='Saisis ton adresse e-mail.';return}const {error}=await c.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+location.pathname});msg.textContent=error?error.message:'Si ce compte existe, un e-mail de réinitialisation va être envoyé.'};</script></body></html>
