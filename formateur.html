<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace Formateur — LED3 Academy</title><link rel="stylesheet" href="style.css"><style>body{background:#080d18;color:#f4f7ff;font-family:system-ui}.wrap{max-width:1000px;margin:auto;padding:20px}.panel{background:#111b2d;border:1px solid #26344e;border-radius:16px;padding:20px;margin:16px 0}.muted{color:#a5b4cc}.btn,button{display:inline-block;padding:11px 15px;border-radius:9px;background:#168bff;color:white;border:0;text-decoration:none;font-weight:bold;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{padding:14px;background:#18243d;border-radius:10px}.stat strong{display:block;font-size:24px;color:#00e5ff}#msg{white-space:pre-wrap}.notice{background:#2c2617;color:#fce7a8;padding:12px;border-radius:8px}</style></head><body><main class="wrap"><p><a href="index.html">← Accueil</a></p><h1>🎓 Espace Formateur</h1><p class="muted">Consultation sécurisée de la progression d’un élève autorisé.</p><p id="msg" class="notice">Vérification de la connexion…</p><section id="dashboard" hidden><div class="panel"><div class="stats"><div class="stat">Progression<strong id="pct">—</strong></div><div class="stat">Sessions terminées<strong id="done">—</strong></div><div class="stat">Moyenne QCM<strong id="avg">—</strong></div><div class="stat">Examens blancs<strong id="ex">—</strong></div></div></div><div class="panel"><h2>Résultats par session</h2><div id="table"></div></div><div class="panel"><h2>Derniers examens blancs</h2><div id="exams"></div></div><button id="refresh">Actualiser</button> <button onclick="window.print()">Imprimer / PDF</button> <button id="logout">Se déconnecter</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const c=supabase.createClient(LED3_SUPABASE_URL,LED3_SUPABASE_PUBLISHABLE_KEY);const msg=document.getElementById('msg');const titles=['Anatomie d’un système LED','Tension et courant','Puissance et énergie','AC / DC et polarité','Driver à courant constant','Alimentation à tension constante','Compatibilité Driver / Module','Chute de tension','Montage en série','Montage en parallèle','Montage série-parallèle','Sections et connecteurs','Diagnostic LED','Thermique LED','Résistances thermiques','Interfaces thermiques','Protection IP, humidité et corrosion','Flux lumineux','Lux, candela et photométrie','Efficacité lumineuse et pertes','Optiques et distribution lumineuse','CCT, chromaticité et SDCM','IRC et R9','UGR, uniformité et sécurité photobiologique','Choisir une famille de gradation','TRIAC, leading edge et trailing edge','Commande 0/1-10 V','DALI : bus, adressage et groupes','DALI DT6 et DT8','DMX512-A','RDM et choix final du système'];function show(p){const get=k=>p[k]||[];const done=get('led3_sessions_done'),hist=get('led3_qcm_historique'),ex=get('led3_exam_history'),results=titles.map((title,i)=>({n:i+1,title,r:p['led3_session_qcm_'+(i+1)]}));document.getElementById('pct').textContent=Math.round(done.length/31*100)+' %';document.getElementById('done').textContent=done.length+' / 31';const wr=results.filter(x=>x.r);document.getElementById('avg').textContent=wr.length?Math.round(wr.reduce((s,x)=>s+x.r.taux,0)/wr.length)+' %':'—';document.getElementById('ex').textContent=ex.length;document.getElementById('table').innerHTML='<table style="width:100%;border-collapse:collapse"><thead><tr><th>Session</th><th>État</th><th>Score</th></tr></thead><tbody>'+results.map(x=>`<tr style="border-top:1px solid #26344e"><td style="padding:8px">${String(x.n).padStart(2,'0')} — ${x.title}</td><td>${done.includes(x.n)?'Terminée':'En cours'}</td><td>${x.r?x.r.score+'/'+x.r.total+' ('+x.r.taux+' %)':'—'}</td></tr>`).join('')+'</tbody></table>';document.getElementById('exams').innerHTML=ex.length?ex.slice(0,10).map(x=>`<p>${new Date(x.date).toLocaleString('fr-FR')} — ${x.score}/${x.total} (${x.pct??x.taux??0} %)</p>`).join(''):'Aucun examen enregistré.';document.getElementById('dashboard').hidden=false;msg.textContent='Données synchronisées depuis Supabase.'}
async function load(){msg.textContent='Vérification de la connexion…';const {data:{session}}=await c.auth.getSession();if(!session){location.href='connexion.html?next=formateur.html';return}msg.textContent='Recherche des élèves autorisés…';const {data:links,error:le}=await c.from('trainer_student_links').select('student_id').eq('trainer_id',session.user.id);if(le){msg.textContent='Accès impossible : '+le.message;return}if(!links||!links.length){msg.textContent='Aucun élève ne vous est encore associé. Le responsable doit autoriser le lien dans Supabase avant de consulter des résultats.';return}const {data,error}=await c.from('student_snapshots').select('payload,updated_at').eq('student_id',links[0].student_id).maybeSingle();if(error){msg.textContent='Lecture impossible : '+error.message;return}if(!data){msg.textContent='Aucun bilan synchronisé pour cet élève pour le moment.';return}show(data.payload||{})}document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await c.auth.signOut();location.href='connexion.html'};load();</script></body></html>
